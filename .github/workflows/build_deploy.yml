# Build file-service, push to ECR, then deploy via:
#   - gitops (default): bump image.tag on GitOps branch main → Argo CD syncs
#       branch `dev`            → apps/file-service/values-dev.yaml
#       tag (must be on `prod`) → apps/file-service/values-prod.yaml
#   - kustomize / helm: apply directly to EKS (legacy / fallback)
#
# Triggers:
#   push `dev`         → build + deploy (environment `dev`); ECR :sha + :dev
#   push tag on `prod` → build + deploy prod; ECR :sha + :latest + :<git-tag>
#                        GitOps values-prod.yaml image.tag = git tag (e.g. v1.2.3)
#   workflow_dispatch  → build + deploy (env from ref)
#
# Secrets: GITOPS_SSH_PRIVATE_KEY (gitops)
# Vars: AWS_ROLE_ARN, AWS_REGION, DEPLOY_TOOL (gitops|kustomize|helm),
#       GITOPS_REPO, GITOPS_BRANCH (default main)

name: Build and deploy to EKS

on:
  push:
    branches:
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

env:
  PROJECT_NAME: test-k8s
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}
  OVERLAY: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  FLOATING_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
  DEPLOY_TOOL: ${{ vars.DEPLOY_TOOL || 'gitops' }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO || 'git@github.com:Piercuta/full-stack-git-ops.git' }}
  GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
    outputs:
      cluster: ${{ steps.ssm.outputs.cluster }}
      ecr_uri: ${{ steps.ssm.outputs.ecr_uri }}
      s3_bucket_name: ${{ steps.ssm.outputs.s3_bucket_name }}
      cloudfront_domain: ${{ steps.ssm.outputs.cloudfront_domain }}
      irsa_role_arn: ${{ steps.ssm.outputs.irsa_role_arn }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on prod branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin prod:refs/remotes/origin/prod
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/prod; then
            echo "Refusing prod deploy: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on branch prod." >&2
            echo "Create the tag from prod, e.g.: git checkout prod && git tag v1.2.3 && git push origin v1.2.3" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on origin/prod — OK for prod deploy."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }

          CLUSTER=$(ssm_get eks_cluster_name)
          ECR_URI=$(ssm_get ecr_file_service)
          S3_BUCKET_NAME=$(ssm_get files_bucket_name)
          MEDIA_URL=$(ssm_get media_url)
          IRSA_ROLE_ARN=$(ssm_get file_service_irsa_role_arn)

          CLOUDFRONT_DOMAIN="${MEDIA_URL#https://}"
          CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN#http://}"
          CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN%/}"

          echo "cluster=${CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "s3_bucket_name=${S3_BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=${CLOUDFRONT_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "irsa_role_arn=${IRSA_ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "Cluster=${CLUSTER} ECR=${ECR_URI}"

      - name: Resolve image tags
        id: meta
        env:
          ECR_URI: ${{ steps.ssm.outputs.ecr_uri }}
        run: |
          set -euo pipefail
          {
            echo "${ECR_URI}:${GITHUB_SHA}"
            echo "${ECR_URI}:${FLOATING_TAG}"
          } > /tmp/ecr-tags.txt

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "${ECR_URI}:${GITHUB_REF_NAME}" >> /tmp/ecr-tags.txt
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

          TAGS=$(paste -sd, /tmp/ecr-tags.txt)
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "ECR tags: ${TAGS}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.ref_name == 'dev' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
    concurrency:
      group: deploy-eks-file-service-${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        if: env.DEPLOY_TOOL != 'gitops'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.DEPLOY_TOOL != 'gitops'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Install kubectl
        if: env.DEPLOY_TOOL != 'gitops'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Helm
        if: env.DEPLOY_TOOL == 'helm'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Update kubeconfig
        if: env.DEPLOY_TOOL != 'gitops'
        run: aws eks update-kubeconfig --name "${{ needs.build.outputs.cluster }}" --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Verify cluster access
        if: env.DEPLOY_TOOL != 'gitops'
        run: |
          aws sts get-caller-identity
          if ! kubectl get namespace "${K8S_NAMESPACE}"; then
            echo "EKS rejected these credentials." >&2
            exit 1
          fi

      - name: Setup GitOps SSH key
        if: env.DEPLOY_TOOL == 'gitops'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}

      - name: Deploy with GitOps (bump image tag)
        if: env.DEPLOY_TOOL == 'gitops'
        env:
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            echo "Missing secret GITOPS_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          VALUES_FILE="apps/file-service/values-${DEPLOY_ENV}.yaml"
          git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO}" gitops-repo
          cd gitops-repo
          if [ ! -f "$VALUES_FILE" ]; then
            echo "Missing ${VALUES_FILE}" >&2
            exit 1
          fi
          awk -v repo="$ECR_URI" -v tag="$IMAGE_TAG" '
            BEGIN { in_image = 0 }
            /^image:/ { in_image = 1; print; next }
            in_image && /^[^ ]/ { in_image = 0 }
            in_image && /^[[:space:]]+repository:/ { print "  repository: " repo; next }
            in_image && /^[[:space:]]+tag:/ { print "  tag: \"" tag "\""; next }
            { print }
          ' "$VALUES_FILE" > "${VALUES_FILE}.tmp"
          mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$VALUES_FILE"
          if git diff --staged --quiet; then
            echo "Image tag already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(file-service): bump image to ${IMAGE_TAG} (${DEPLOY_ENV})"
          git push origin "HEAD:${GITOPS_BRANCH}"

      - name: Deploy with Kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        env:
          S3_BUCKET_NAME: ${{ needs.build.outputs.s3_bucket_name }}
          CLOUDFRONT_DOMAIN: ${{ needs.build.outputs.cloudfront_domain }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          (
            cd "k8s/overlays/${OVERLAY}"
            printf 'S3_BUCKET_NAME=%s\nCLOUDFRONT_DOMAIN=%s\n' \
              "$S3_BUCKET_NAME" "$CLOUDFRONT_DOMAIN" > generated-file-service.env
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: ServiceAccount' \
              'metadata:' \
              '  name: file-service' \
              '  annotations:' \
              "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" \
              > irsa-patch.yaml
            kustomize edit set image "file-service=${ECR_URI}:${IMAGE_TAG}"
          )
          kubectl apply -k "k8s/overlays/${OVERLAY}"
          kubectl rollout status "deployment/file-service" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Deploy with Helm
        if: env.DEPLOY_TOOL == 'helm'
        env:
          S3_BUCKET_NAME: ${{ needs.build.outputs.s3_bucket_name }}
          CLOUDFRONT_DOMAIN: ${{ needs.build.outputs.cloudfront_domain }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REPLICAS=1
          if [ "${DEPLOY_ENV}" != "dev" ]; then REPLICAS=2; fi
          printf '%s\n' \
            "replicaCount: ${REPLICAS}" \
            "image:" \
            "  repository: ${ECR_URI}" \
            "  tag: \"${IMAGE_TAG}\"" \
            "serviceAccount:" \
            "  annotations:" \
            "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
            "config:" \
            "  S3_BUCKET_NAME: \"${S3_BUCKET_NAME}\"" \
            "  CLOUDFRONT_DOMAIN: \"${CLOUDFRONT_DOMAIN}\"" \
            > /tmp/helm-ci-values.yaml
          helm upgrade --install file-service ./charts/file-service \
            -n "${K8S_NAMESPACE}" \
            -f /tmp/helm-ci-values.yaml \
            --wait --timeout 180s
