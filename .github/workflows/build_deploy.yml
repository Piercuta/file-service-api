# Build the file-service image, push it to ECR, then deploy to EKS with
# Kustomize (default) or Helm. Infra values come from SSM Parameter Store:
#   /<project>/<env>/<key>  e.g. /test-k8s/dev/eks_cluster_name
#
#   push `dev`              → build + deploy automatically (environment `dev`)
#   push `master` / `main`  → build only
#   Run workflow on `master` / `main` / tag → build + deploy (manual prod release)
#
# Vars:
#   AWS_ROLE_ARN
#   AWS_REGION               defaults to eu-west-1
#   DEPLOY_TOOL             kustomize (default) | helm
#
# IAM: ssm:GetParameter on /test-k8s/* , ECR push, EKS API access.

name: Build and deploy to EKS

on:
  push:
    branches:
      - master
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

env:
  PROJECT_NAME: test-k8s
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}
  OVERLAY: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  FLOATING_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
  DEPLOY_TOOL: ${{ vars.DEPLOY_TOOL || 'kustomize' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    outputs:
      cluster: ${{ steps.ssm.outputs.cluster }}
      ecr_uri: ${{ steps.ssm.outputs.ecr_uri }}
      s3_bucket_name: ${{ steps.ssm.outputs.s3_bucket_name }}
      cloudfront_domain: ${{ steps.ssm.outputs.cloudfront_domain }}
      irsa_role_arn: ${{ steps.ssm.outputs.irsa_role_arn }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }

          CLUSTER=$(ssm_get eks_cluster_name)
          ECR_URI=$(ssm_get ecr_file_service)
          S3_BUCKET_NAME=$(ssm_get files_bucket_name)
          MEDIA_BASE_URL=$(ssm_get media_base_url)
          IRSA_ROLE_ARN=$(ssm_get file_service_irsa_role_arn)

          CLOUDFRONT_DOMAIN="${MEDIA_BASE_URL#https://}"
          CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN#http://}"
          CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN%/}"

          echo "cluster=${CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "s3_bucket_name=${S3_BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=${CLOUDFRONT_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "irsa_role_arn=${IRSA_ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "Cluster=${CLUSTER} ECR=${ECR_URI} bucket=${S3_BUCKET_NAME} cf=${CLOUDFRONT_DOMAIN}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ssm.outputs.ecr_uri }}:${{ github.sha }}
            ${{ steps.ssm.outputs.ecr_uri }}:${{ env.FLOATING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    concurrency:
      group: deploy-eks-file-service-${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Helm
        if: env.DEPLOY_TOOL == 'helm'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ needs.build.outputs.cluster }}" --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Verify cluster access
        run: |
          echo "GitHub Actions IAM identity (this ARN needs an EKS access entry):"
          aws sts get-caller-identity
          if ! kubectl get namespace "${K8S_NAMESPACE}"; then
            echo "EKS rejected these credentials. Add this IAM principal as an access entry on ${{ needs.build.outputs.cluster }} with AmazonEKSClusterAdminPolicy (terraform cluster_admin_principal_arns)." >&2
            exit 1
          fi

      - name: Deploy with Kustomize
        if: env.DEPLOY_TOOL == 'kustomize'
        env:
          S3_BUCKET_NAME: ${{ needs.build.outputs.s3_bucket_name }}
          CLOUDFRONT_DOMAIN: ${{ needs.build.outputs.cloudfront_domain }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          (
            cd "k8s/overlays/${OVERLAY}"
            printf 'S3_BUCKET_NAME=%s\nCLOUDFRONT_DOMAIN=%s\n' \
              "$S3_BUCKET_NAME" "$CLOUDFRONT_DOMAIN" > generated-file-service.env
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: ServiceAccount' \
              'metadata:' \
              '  name: file-service' \
              '  annotations:' \
              "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" \
              > irsa-patch.yaml
            kustomize edit set image "file-service=${ECR_URI}:${IMAGE_TAG}"
          )
          kubectl apply -k "k8s/overlays/${OVERLAY}"
          kubectl rollout status "deployment/file-service" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Deploy with Helm
        if: env.DEPLOY_TOOL == 'helm'
        env:
          S3_BUCKET_NAME: ${{ needs.build.outputs.s3_bucket_name }}
          CLOUDFRONT_DOMAIN: ${{ needs.build.outputs.cloudfront_domain }}
          IRSA_ROLE_ARN: ${{ needs.build.outputs.irsa_role_arn }}
          ECR_URI: ${{ needs.build.outputs.ecr_uri }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          REPLICAS=1
          if [ "${DEPLOY_ENV}" != "dev" ]; then REPLICAS=2; fi
          printf '%s\n' \
            "replicaCount: ${REPLICAS}" \
            "image:" \
            "  repository: ${ECR_URI}" \
            "  tag: \"${IMAGE_TAG}\"" \
            "serviceAccount:" \
            "  annotations:" \
            "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
            "config:" \
            "  S3_BUCKET_NAME: \"${S3_BUCKET_NAME}\"" \
            "  CLOUDFRONT_DOMAIN: \"${CLOUDFRONT_DOMAIN}\"" \
            > /tmp/helm-ci-values.yaml
          helm upgrade --install file-service ./charts/file-service \
            -n "${K8S_NAMESPACE}" \
            -f /tmp/helm-ci-values.yaml \
            --wait --timeout 180s
