name: Build and deploy to EKS
run-name: file-service · build & deploy · ${{ github.ref_name }}

# Build the file-service image, push it to ECR, then trigger deploy-gitops.
#
# Triggers:
#   push `dev`         → build + GitOps deploy (dev); ECR :sha + :dev
#   push tag on `prod` → build + GitOps deploy (prod); ECR :sha + :latest + :<git-tag>
#   workflow_dispatch  → build + GitOps deploy (env from ref)
#
# Manual deploy fallbacks: Actions → "Deploy Helm" / "Deploy Kustomize"
#
# Secrets: GITOPS_SSH_PRIVATE_KEY (deploy-gitops)
# Vars: AWS_ROLE_ARN, AWS_REGION, GITOPS_REPO, GITOPS_BRANCH (default main)

on:
  push:
    branches:
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

env:
  K8S_NAMESPACE: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}
  FLOATING_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
    outputs:
      deploy_env: ${{ env.DEPLOY_ENV }}
      ecr_uri: ${{ steps.ssm.outputs.ecr_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on prod branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin prod:refs/remotes/origin/prod
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/prod; then
            echo "Refusing prod deploy: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on branch prod." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM parameters
        id: ssm
        uses: ./.github/actions/read-file-service-ssm
        with:
          ssm_prefix: ${{ env.SSM_PREFIX }}

      - name: Resolve image tags
        id: meta
        env:
          ECR_URI: ${{ steps.ssm.outputs.ecr_uri }}
        run: |
          set -euo pipefail
          {
            echo "${ECR_URI}:${GITHUB_SHA}"
            echo "${ECR_URI}:${FLOATING_TAG}"
          } > /tmp/ecr-tags.txt
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "${ECR_URI}:${GITHUB_REF_NAME}" >> /tmp/ecr-tags.txt
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          TAGS=$(paste -sd, /tmp/ecr-tags.txt)
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          provenance: false
          sbom: false

