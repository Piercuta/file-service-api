# Build file-service, push to ECR, then deploy via gitops (default) / kustomize / helm.
#   branch `dev`           → values-dev.yaml on GitOps main
#   tag / master (manual)  → values-prod.yaml on GitOps main
#
# Variables: AWS_*, DEPLOY_TOOL (gitops|kustomize|helm),
#   GITOPS_SSH_PRIVATE_KEY, GITOPS_REPO, GITOPS_BRANCH (main)

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        DEPLOY_ENV: dev
        OVERLAY: dev
        FLOATING_TAG: dev
        SSM_PREFIX: /test-k8s/dev
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
      variables:
        DEPLOY_ENV: prod
        OVERLAY: prod
        FLOATING_TAG: latest
        SSM_PREFIX: /test-k8s/prod
    - if: $CI_COMMIT_TAG
      variables:
        DEPLOY_ENV: prod
        OVERLAY: prod
        FLOATING_TAG: latest
        SSM_PREFIX: /test-k8s/prod

stages:
  - build
  - deploy

variables:
  PROJECT_NAME: test-k8s
  AWS_DEFAULT_REGION: $AWS_REGION
  AWS_REGION: eu-west-1
  K8S_NAMESPACE: test-k8s
  DEPLOY_TOOL: gitops
  GITOPS_REPO: git@github.com:Piercuta/full-stack-git-ops.git
  GITOPS_BRANCH: main
  DOCKER_TLS_CERTDIR: "/certs"

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  environment:
    name: $DEPLOY_ENV
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      ssm_get() {
        val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
        if [ -z "$val" ] || [ "$val" = "None" ]; then
          echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
          exit 1
        fi
        printf '%s' "$val"
      }

      CLUSTER=$(ssm_get eks_cluster_name)
      ECR_URI=$(ssm_get ecr_file_service)
      S3_BUCKET_NAME=$(ssm_get files_bucket_name)
      MEDIA_URL=$(ssm_get media_url)
      IRSA_ROLE_ARN=$(ssm_get file_service_irsa_role_arn)

      CLOUDFRONT_DOMAIN="${MEDIA_URL#https://}"
      CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN#http://}"
      CLOUDFRONT_DOMAIN="${CLOUDFRONT_DOMAIN%/}"

      ECR_REGISTRY=$(echo "$ECR_URI" | cut -d/ -f1)
      aws ecr get-login-password --region "${AWS_REGION}" \
        | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      docker build \
        -t "${ECR_URI}:${CI_COMMIT_SHA}" \
        -t "${ECR_URI}:${FLOATING_TAG}" \
        .
      docker push "${ECR_URI}:${CI_COMMIT_SHA}"
      docker push "${ECR_URI}:${FLOATING_TAG}"

      {
        echo "CLUSTER=${CLUSTER}"
        echo "ECR_URI=${ECR_URI}"
        echo "S3_BUCKET_NAME=${S3_BUCKET_NAME}"
        echo "CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}"
        echo "IRSA_ROLE_ARN=${IRSA_ROLE_ARN}"
        echo "IMAGE_TAG=${CI_COMMIT_SHA}"
      } > build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build
      artifacts: true
  environment:
    name: $DEPLOY_ENV
  resource_group: deploy-eks-file-service-$DEPLOY_ENV
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
      when: manual
    - when: manual
  before_script:
    - |
      if [ "${DEPLOY_TOOL}" = "gitops" ]; then
        apk add --no-cache git openssh-client
      else
        apk add --no-cache aws-cli curl
        curl -sLO "https://dl.k8s.io/release/v1.32.3/bin/linux/amd64/kubectl"
        chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
        if [ "${DEPLOY_TOOL}" = "helm" ]; then
          curl -sL "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" | tar xz
          mv linux-amd64/helm /usr/local/bin/helm
        else
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
          mv kustomize /usr/local/bin/kustomize
        fi
      fi
  script:
    - |
      set -euo pipefail
      if [ "${DEPLOY_TOOL}" = "gitops" ]; then
        if [ -z "${GITOPS_SSH_PRIVATE_KEY:-}" ]; then
          echo "Missing GITOPS_SSH_PRIVATE_KEY" >&2
          exit 1
        fi
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        if [ -f "${GITOPS_SSH_PRIVATE_KEY}" ]; then
          cp "${GITOPS_SSH_PRIVATE_KEY}" ~/.ssh/id_ed25519
        else
          printf '%s\n' "${GITOPS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
        fi
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
        VALUES_FILE="apps/file-service/values-${DEPLOY_ENV}.yaml"
        git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO}" gitops-repo
        cd gitops-repo
        awk -v repo="$ECR_URI" -v tag="$IMAGE_TAG" '
          BEGIN { in_image = 0 }
          /^image:/ { in_image = 1; print; next }
          in_image && /^[^ ]/ { in_image = 0 }
          in_image && /^[[:space:]]+repository:/ { print "  repository: " repo; next }
          in_image && /^[[:space:]]+tag:/ { print "  tag: \"" tag "\""; next }
          { print }
        ' "$VALUES_FILE" > "${VALUES_FILE}.tmp"
        mv "${VALUES_FILE}.tmp" "$VALUES_FILE"
        git config user.email "gitlab-ci@noreply.local"
        git config user.name "gitlab-ci"
        git add "$VALUES_FILE"
        if git diff --staged --quiet; then echo "No change"; exit 0; fi
        git commit -m "chore(file-service): bump image to ${IMAGE_TAG} (${DEPLOY_ENV})"
        git push origin "HEAD:${GITOPS_BRANCH}"
        exit 0
      fi

      aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}"
      if ! kubectl get namespace "${K8S_NAMESPACE}"; then exit 1; fi
      if [ "${DEPLOY_TOOL}" = "helm" ]; then
        REPLICAS=1
        if [ "${DEPLOY_ENV}" != "dev" ]; then REPLICAS=2; fi
        printf '%s\n' \
          "replicaCount: ${REPLICAS}" \
          "image:" \
          "  repository: ${ECR_URI}" \
          "  tag: \"${IMAGE_TAG}\"" \
          "serviceAccount:" \
          "  annotations:" \
          "    eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"" \
          "config:" \
          "  S3_BUCKET_NAME: \"${S3_BUCKET_NAME}\"" \
          "  CLOUDFRONT_DOMAIN: \"${CLOUDFRONT_DOMAIN}\"" \
          > /tmp/helm-ci-values.yaml
        helm upgrade --install file-service ./charts/file-service \
          -n "${K8S_NAMESPACE}" -f /tmp/helm-ci-values.yaml --wait --timeout 180s
      else
        (
          cd "k8s/overlays/${OVERLAY}"
          printf 'S3_BUCKET_NAME=%s\nCLOUDFRONT_DOMAIN=%s\n' \
            "$S3_BUCKET_NAME" "$CLOUDFRONT_DOMAIN" > generated-file-service.env
          printf '%s\n' \
            'apiVersion: v1' 'kind: ServiceAccount' 'metadata:' \
            '  name: file-service' '  annotations:' \
            "    eks.amazonaws.com/role-arn: ${IRSA_ROLE_ARN}" > irsa-patch.yaml
          kustomize edit set image "file-service=${ECR_URI}:${IMAGE_TAG}"
        )
        kubectl apply -k "k8s/overlays/${OVERLAY}"
        kubectl rollout status "deployment/file-service" -n "${K8S_NAMESPACE}" --timeout=180s
      fi
